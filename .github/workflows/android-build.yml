
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project
        run: |
          ls -la
          test -f gradlew
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build APK
        run: |
          chmod +x gradlew
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jay-Gurudev-Matla-Center-APK
          path: app/build/outputs/apk/debug/*.apk
          
